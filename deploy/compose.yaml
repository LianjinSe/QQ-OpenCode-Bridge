services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      MODE: ws
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:?Run deploy/configure.py first}
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:3001:3001"
    volumes:
      - ../data/napcat/qq:/app/.config/QQ
      - ../data/napcat/config:/app/napcat/config
      - ../data/napcat/plugins:/app/napcat/plugins

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    profiles: [memory]
    restart: unless-stopped
    environment:
      POSTGRES_USER: qqbridge
      POSTGRES_DB: qqbridge
      POSTGRES_PASSWORD: ${QQ_POSTGRES_PASSWORD:?Run deploy/configure.py first}
    ports:
      - "127.0.0.1:${QQ_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ../data/postgresql:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-vector.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U qqbridge -d qqbridge"]
      interval: 10s
      timeout: 5s
      retries: 6
